name: Deploy Sonora

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-sonora
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    environment:
      name: Production
      url: ${{ steps.extract-url.outputs.app_url }}
    steps:
      - name: Update repository and rebuild containers
        run: |
          cd "$HOME/Sonora"
          git pull origin main
          docker compose up -d --build --remove-orphans

      - name: Set deployment URL
        id: extract-url
        run: |
          cd "$HOME/Sonora"
          if [ -n "${CUSTOM_DOMAIN:-}" ]; then
            TUNNEL_URL="https://${CUSTOM_DOMAIN}"
          else
            TUNNEL_URL=$(docker compose logs tunnel 2>/dev/null | grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' | tail -n 1)
          fi

          if [ -n "$TUNNEL_URL" ]; then
            echo "app_url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"
          else
            echo "app_url=http://localhost:8087" >> "$GITHUB_OUTPUT"
          fi
